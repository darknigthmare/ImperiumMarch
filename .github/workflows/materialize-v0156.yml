name: Materialize reviewed offline package 0.15.6

# Temporary publication helper. Removed before the final PR tree is merged.
"on":
  push:
    branches:
      - codex/painted-installations-v0156
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

concurrency:
  group: materialize-v0156-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'darknigthmare/ImperiumMarch' && github.ref == 'refs/heads/codex/painted-installations-v0156'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATERIALIZE_BRANCH: codex/painted-installations-v0156
      EXPECTED_HTML_SHA256: 7d346e0fcfacf6507a89bc10840ed1cf370297e6dff7566d0a339e7ac0c77b8e
      EXPECTED_ZIP_SHA256: 2ad83ba23c1fc0f5f3cdc5ba2d929c68ba41707a9f26bd50c0fee67f553bcb67
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_OFFLINE: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm source identity and runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$MATERIALIZE_BRANCH"
          test "$(node -p 'process.versions.node.split(".")[0]')" = '22'

      - name: Build the exact offline HTML and ZIP without dependencies
        run: npm run build

      - name: Require the reviewed local SHA-256 values
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_HTML_SHA256" 'dist/Ordre_de_Cendre.html' | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" 'dist/Ordre_de_Cendre.zip' | sha256sum --check --strict
          python3 - <<'VERIFY'
          import hashlib, os, zipfile
          with zipfile.ZipFile('dist/Ordre_de_Cendre.zip') as archive:
              assert archive.namelist() == ['Ordre_de_Cendre.html']
              assert archive.testzip() is None
              assert hashlib.sha256(archive.read('Ordre_de_Cendre.html')).hexdigest() == os.environ['EXPECTED_HTML_SHA256']
          print('Independent ZIP extraction matches the reviewed standalone HTML.')
          VERIFY

      - name: Commit only the reviewed offline ZIP
        run: |
          set -euo pipefail
          git add -- dist/Ordre_de_Cendre.zip
          if git diff --cached --quiet; then
            echo 'The offline ZIP already matches the reviewed local file.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = 'dist/Ordre_de_Cendre.zip'
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Materialize reviewed 0.15.6 offline ZIP from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/$MATERIALIZE_BRANCH"
