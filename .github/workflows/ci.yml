name: Validate prototype and design data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install pinned development-only raster validator
        run: npm install --no-save --no-package-lock --ignore-scripts @napi-rs/canvas@0.1.100
      - name: Validate shared SVG and Canvas rendering
        run: npm run check:assets-render
      - run: npm run check
      - run: npm run build
      - run: npm run check:ui
      - run: npm run check:ui-runtime
      - run: npm run build:web
