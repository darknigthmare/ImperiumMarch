name: Validate prototype and design data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install pinned development-only raster validator
        run: npm install --no-save --no-package-lock --ignore-scripts @napi-rs/canvas@0.1.100
      - name: Validate shared SVG and Canvas rendering
        run: npm run check:assets-render
      - name: Decode and validate the painted MI14 sprites
        run: npm run check:painted
      - name: Decode and validate the painted combat sprites
        run: npm run check:combat
      - name: Decode and validate the painted walker parts
        run: npm run check:walkers
      - name: Decode and validate the painted Thyr life
        run: npm run check:thyr
      - name: Decode and validate Cerbere and its weapon mount
        run: npm run check:cerbere
      - name: Decode and validate railway and industrial transport
        run: npm run check:transport
      - name: Decode and validate the Praetor and command relays
        run: npm run check:relay
      - name: Decode and validate the Nacre vehicles
        run: npm run check:nacre
      - name: Decode and validate the Nacre infrastructure
        run: npm run check:nacre-sites
      - name: Decode and validate the chemical field equipment
        run: npm run check:chemical
      - name: Decode and validate the voice mission equipment and nesting sites
        run: npm run check:voice
      - name: Decode and validate Vesper buildings and machinery
        run: npm run check:vesper
      - name: Decode and validate the living route equipment
        run: npm run check:route
      - name: Decode and validate the foundry site equipment
        run: npm run check:foundry-sites
      - name: Decode and validate the three painted world panoramas
        run: npm run check:worlds
      - name: Decode and validate Nacre technicians, staff and patients
        run: npm run check:nacre-people
      - name: Decode and validate Vesper terrain, scenery and railway viaduct
        run: npm run check:vesper-scenery
      - name: Decode and validate Nacre civilians and quay services
        run: npm run check:nacre-civilians
      - name: Decode and validate Nacre terrain and shoreline scenery
        run: npm run check:nacre-scenery
      - run: npm run check
      - run: npm run build
      - run: npm run check:offline-package
      - run: npm run check:ui
      - run: npm run check:ui-runtime
      - run: npm run build:web
